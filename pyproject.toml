[project]
name = "hemo-scan"
version = "0.1.0"
description = "Assisted blood sample quality assessment from tube photos"
readme = "README.md"
authors = [
    { name = "Gabriel Frigo", email = "gfrigo.sena@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "openai>=3.7.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
hemo-scan = "hemo_scan:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
